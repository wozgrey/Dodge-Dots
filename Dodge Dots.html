```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALLING DODGE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151515;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
}

h1 {
  letter-spacing: 5px;
  margin-top: 25px;
}

#info {
  font-size: 18px;
  margin: 15px;
}

canvas {
  background: #222;
  border: 2px solid white;
  width: min(600px, 95vw);
  height: auto;
  display: block;
  margin: auto;
}

#controls {
  margin-top: 15px;
  color: #ccc;
  font-size: 14px;
}

button {
  padding: 10px 25px;
  margin: 15px 5px;
  background: transparent;
  border: 1px solid white;
  color: white;
  cursor: pointer;
}

button:hover {
  background: white;
  color: black;
}

</style>
</head>

<body>

<h1>FALLING DODGE</h1>

<div id="info">
  SCORE: <span id="score">0</span>
  &nbsp; | &nbsp;
  BEST: <span id="best">0</span>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="controls">
  MOVE : A / D または ← / → 
</div>

<button onclick="restart()">RESTART</button>

<script>

// =====================================
// 基本設定
// =====================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 600;
const HEIGHT = 600;

// =====================================
// ゲーム変数
// =====================================

let player;
let enemies = [];

let score = 0;
let best = 0;

let running = true;
let lastTime = 0;
let spawnTimer = 0;

let keys = {};

// =====================================
// プレイヤー初期化
// =====================================

function createPlayer() {
  return {
    x: 280,
    y: 540,
    w: 40,
    h: 40,
    speed: 380
  };
}

// =====================================
// ゲーム開始・リスタート
// =====================================

function restart() {

  player = createPlayer();

  enemies = [];

  score = 0;

  running = true;

  spawnTimer = 0;

  lastTime = 0;

  document.getElementById("score").textContent = 0;

  requestAnimationFrame(loop);
}

// =====================================
// キーボード操作
// =====================================

document.addEventListener("keydown", e => {

  const key = e.key.toLowerCase();

  if (
    ["arrowleft", "arrowright", " "].includes(key)
  ) {
    e.preventDefault();
  }

  keys[key] = true;

  if (key === "enter" && !running) {
    restart();
  }

});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  keys = {};
});

// =====================================
// 障害物生成
// =====================================

function spawnEnemy() {

  const size = 25 + Math.random() * 35;

  enemies.push({

    x: Math.random() * (WIDTH - size),

    y: -size,

    w: size,

    h: size,

    speed: 180 + score * 5 + Math.random() * 100

  });

}

// =====================================
// プレイヤー移動
// =====================================

function updatePlayer(dt) {

  if (keys["a"] || keys["arrowleft"]) {
    player.x -= player.speed * dt;
  }

  if (keys["d"] || keys["arrowright"]) {
    player.x += player.speed * dt;
  }

  // 画面外に出ないようにする
  player.x = Math.max(
    0,
    Math.min(WIDTH - player.w, player.x)
  );

}

// =====================================
// 障害物更新
// =====================================

function updateEnemies(dt) {

  // 時間経過で障害物を生成
  spawnTimer += dt;

  const spawnInterval = Math.max(
    0.18,
    0.8 - score * 0.005
  );

  if (spawnTimer >= spawnInterval) {

    spawnEnemy();

    spawnTimer = 0;

  }

  // 障害物を落下させる
  enemies.forEach(e => {
    e.y += e.speed * dt;
  });

  // 画面外の障害物を削除
  enemies = enemies.filter(e => e.y < HEIGHT);

}

// =====================================
// スコア更新
// =====================================

function updateScore(dt) {

  score += dt * 10;

  const currentScore = Math.floor(score);

  document.getElementById("score").textContent =
    currentScore;

}

// =====================================
// 当たり判定
// =====================================

function checkCollision() {

  for (const e of enemies) {

    if (

      player.x < e.x + e.w &&

      player.x + player.w > e.x &&

      player.y < e.y + e.h &&

      player.y + player.h > e.y

    ) {

      gameOver();

      return;

    }

  }

}

// =====================================
// ゲームオーバー
// =====================================

function gameOver() {

  if (!running) return;

  running = false;

  const result = Math.floor(score);

  if (result > best) {

    best = result;

    document.getElementById("best").textContent =
      best;

  }

}

// =====================================
// 描画
// =====================================

function draw() {

  // 背景
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  // プレイヤー
  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    player.x,
    player.y,
    player.w,
    player.h
  );

  // 障害物
  ctx.fillStyle = "#ff4545";

  enemies.forEach(e => {

    ctx.fillRect(
      e.x,
      e.y,
      e.w,
      e.h
    );

  });

  // ゲームオーバー画面
  if (!running) {

    ctx.fillStyle = "rgba(0,0,0,0.8)";

    ctx.fillRect(
      0,
      0,
      WIDTH,
      HEIGHT
    );

    ctx.fillStyle = "white";

    ctx.textAlign = "center";

    ctx.font = "bold 40px Arial";

    ctx.fillText(
      "GAME OVER",
      WIDTH / 2,
      260
    );

    ctx.font = "22px Arial";

    ctx.fillText(
      "SCORE: " + Math.floor(score),
      WIDTH / 2,
      310
    );

    ctx.font = "17px Arial";

    ctx.fillText(
      "PRESS ENTER TO RESTART",
      WIDTH / 2,
      360
    );

  }

}

// =====================================
// メインループ
// =====================================

function loop(time) {

  if (!running) {

    draw();

    return;

  }

  if (!lastTime) {
    lastTime = time;
  }

  const dt = Math.min(
    (time - lastTime) / 1000,
    0.05
  );

  lastTime = time;

  // 更新
  updatePlayer(dt);

  updateEnemies(dt);

  updateScore(dt);

  checkCollision();

  // 描画
  draw();

  // 次のフレーム
  if (running) {
    requestAnimationFrame(loop);
  }

}

// =====================================
// ゲーム開始
// =====================================

restart();

</script>

</body>
</html>
